    <style>
        body { background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); font-family: sans-serif; padding: 15px; padding-bottom: 80px; margin: 0;}
        h2 { font-size: 18px; margin-bottom: 15px; }
        details { margin-bottom: 10px; background: var(--tg-theme-secondary-bg-color, #f4f4f5); border-radius: 8px; padding: 10px; }
        summary { font-weight: bold; font-size: 16px; outline: none; margin-bottom: 5px; cursor: pointer; }
        .work-item { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--tg-theme-hint-color, #ccc); }
        .work-item:last-child { border-bottom: none; padding-bottom: 0; }
        label { font-size: 14px; flex: 1; display: flex; align-items: center; cursor: pointer; }
        input[type="checkbox"] { transform: scale(1.3); margin-right: 10px; }
        input[type="number"] { width: 50px; padding: 5px; font-size: 14px; text-align: center; border: 1px solid #ccc; border-radius: 5px;}
        
        /* Стили для кастомных строк */
        .custom-work-item { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .custom-name { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        .custom-qty { width: 60px !important; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; text-align: center; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000);}
        .add-btn { margin-top: 15px; width: 100%; padding: 10px; border-radius: 8px; border: 2px dashed var(--tg-theme-button-color, #3390ec); background: transparent; color: var(--tg-theme-button-color, #3390ec); font-weight: bold; cursor: pointer; font-size: 14px; }
        
        #sendBtn { position: fixed; bottom: 15px; left: 15px; right: 15px; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 10px; border: none; background-color: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #ffffff); cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>

            <div class="work-item">

            <div class="work-item">

        </details>

        <details>

        <details>
            <summary>➕ Своя позиция / Доп. оборудование</summary>
            <div id="customWorks">
                <div class="custom-work-item">
                    <input type="text" class="custom-name" placeholder="Наименование...">
                    <input type="number" class="custom-qty" placeholder="шт" min="1">
                </div>
            </div>
            <button type="button" id="addCustomBtn" class="add-btn">+ Добавить еще строку</button>
        </details>

    </div>
    <button id="sendBtn">Отправить отчет</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Включение поля количества при нажатии на галочку
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                let input = this.closest('.work-item').querySelector('.qty');
                if(this.checked) {
                    input.disabled = false; input.value = 1;
                } else {
                    input.disabled = true; input.value = '';
                }
            });
        });

        // Добавление новой пустой строки для ручного ввода
        document.getElementById('addCustomBtn').addEventListener('click', () => {
            const container = document.getElementById('customWorks');
            const div = document.createElement('div');
            div.className = 'custom-work-item';
            div.innerHTML = `
                <input type="text" class="custom-name" placeholder="Наименование...">
                <input type="number" class="custom-qty" placeholder="шт" min="1">
            `;
            container.appendChild(div);
        });

        // Отправка данных обратно в бота
        document.getElementById('sendBtn').addEventListener('click', () => {
            let results = [];
            
            // 1. Собираем стандартные работы (где стоят галочки)
            document.querySelectorAll('.work-item').forEach(item => {
                let checkbox = item.querySelector('input[type="checkbox"]');
                if(checkbox.checked) {
                    let qty = item.querySelector('.qty').value;
                    results.push({ name: checkbox.value, qty: parseInt(qty) || 1 });
                }
            });

            // 2. Собираем кастомные работы (введенные текстом)
            document.querySelectorAll('.custom-work-item').forEach(item => {
                let name = item.querySelector('.custom-name').value.trim();
                let qty = item.querySelector('.custom-qty').value;
                if(name !== '') { // Если мастер что-то написал
                    results.push({ name: name, qty: parseInt(qty) || 1 });
                }
            });

            // Если вообще ничего не выбрано и не написано
            if(results.length === 0) {
                tg.showAlert("Выберите хотя бы одну работу или впишите свою!");
                return;
            }

            tg.sendData(JSON.stringify(results));
        });
    </script>
</body>
</html>
